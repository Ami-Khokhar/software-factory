# The factory's skills: the `/` commands a person uses to talk to the Foreman and the Planner.
#
# A skill adds no capability. It asks a Bot to use tools the Bot already holds, and policy.json
# still decides every call. The `tools:` lists also narrow what a Bot is offered on a run (OpenBot
# offers the chosen skills' tools plus every tool no skill claims, so the job tools stay offered).
# Refs are `<serverId>/<toolName>`; they load nothing until factory-mcp is added under the id
# `factory-mcp` (docs/RUNBOOK.md, OpenBot).
skills:
  - slug: factory-status
    title: Factory status
    summary: Show what the factory is doing and which WorkItems need a person.
    instructions: >-
      Call factory_status. If the person names a WorkItem (owner/repo#n), call it with that id.
      Give one line for each WorkItem: its id, its state, its PR number and what it needs from the
      person. Put the WorkItems in human_waiting or blocked first. Report only what factory_status
      returns. Never guess a state.
    tools:
      - factory-mcp/factory_status

  - slug: drive-issue
    title: Drive an issue
    summary: Take a GitHub issue into the factory and drive it to a merged PR.
    instructions: >-
      The person names a repo and an issue number. Call factory_intake with them. If it refuses,
      give the refusal word for word and stop. The usual causes are a missing "## Acceptance"
      section, an author who is not trusted, and a repo that is not a factory repo. Then call
      start_job with the goal "Drive WorkItem <id> to closed" and the done-test "factory_status
      shows the WorkItem closed". Name the WorkItem id and its state.
    tools:
      - factory-mcp/factory_intake
      - factory-mcp/factory_tick
      - factory-mcp/factory_status

  - slug: answer-escalation
    title: Answer an escalation
    summary: Record a person's retry, regate or close decision for a WorkItem that waits on a person.
    instructions: >-
      Call factory_status with the WorkItem id and read its escalation. If the person has not
      chosen retry, regate or close, give them the reason and what each choice does, and ask which
      one. Retry gives the worker another pass with the person's note. Regate asks the gate to
      review a fix the person pushed. Close cancels the WorkItem. Then call factory_resolve_human
      with the id, the choice, the person's own words as the note and their name as by. Never
      choose for the person.
    tools:
      - factory-mcp/factory_status
      - factory-mcp/factory_resolve_human

  - slug: plan-issues
    title: Plan factory issues
    summary: Split a goal into small GitHub issues the factory can finish, each with checkable acceptance.
    instructions: >-
      Split the goal into issues that each fit one PR of at most 600 changed lines and 20 files,
      and that each make sense alone. Give each issue an "## Acceptance" heading with bullets of
      the form "- <claim> — done when: <check>". Each check must be readable from the result: a
      test that passes, a command that prints something, a file that contains something. Call
      factory_propose_issue once for each issue. Never add the factory:ready label: a person does.
      Never propose work on .github/ or AGENTS.md. List the issues you proposed, one line each,
      with their numbers.
    tools:
      - factory-mcp/factory_propose_issue
      - factory-mcp/factory_status

  - slug: write-acceptance
    title: Write acceptance checks
    summary: Turn a request into acceptance bullets that the factory can check.
    instructions: >-
      Rewrite the request as an "## Acceptance" section with one bullet for each claim, in the
      form "- <claim> — done when: <check>". Make each check something a machine can test from the
      result. Add one bullet that says what must not change. If you cannot state a check for a
      claim, say so and ask for one. Do not open an issue.
