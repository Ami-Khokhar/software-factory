# Day Desk's settings (ADR-0013). `hermes profile install` copies this file into the profile, and
# `hermes -p day-desk model` and `hermes -p day-desk gateway setup` then add the model and the
# Telegram settings. Secrets live in the profile's .env, never here.

mcp_servers:
  factory:
    # factory-mcp listens on loopback only. If you set FACTORY_PORT, set the same port here.
    url: "http://127.0.0.1:43125/mcp"
    headers:
      Authorization: "Bearer ${FACTORY_MCP_TOKEN}"
    trust: untrusted  # every tool without readOnlyHint waits for the owner's yes in Telegram
    tools:
      include:  # factory_tick and factory_intake stay out: factory-mcp ticks on its own
        - factory_status
        - factory_repo_check
        - factory_bootstrap_repo
        - factory_add_repo
        - factory_approve_issue
        - factory_propose_issue
        - factory_start_plan
        - factory_resolve_human
        - factory_lessons
        - factory_approve_lesson
        - factory_retire_lesson

agent:
  # The shell runs in the Docker sandbox below (ADR-0021). These stay off because they run on the
  # host as the owner, where they could read the profile's .env and call factory tools with no
  # approval: code_execution's script calls tools back on the host, and file, browser,
  # computer_use and delegation add nothing the shell needs. factory-watch runs as a no-agent script.
  disabled_toolsets: [code_execution, file, browser, computer_use, delegation]

terminal:
  # A container per session, from tenant/hermes/sandbox. It gets no host directory it can write and
  # one secret: the GitHub token, which the image's gh wrapper hands to gh as GH_TOKEN.
  backend: docker
  docker_image: "day-desk-sandbox:1"
  container_persistent: false  # no bind mount from the host; the container goes with the session
  cwd: /day-desk  # the image user's home, which it can write; Hermes's tmpfs over /root is root's
  env_passthrough: [DAYDESK_GITHUB_TOKEN]

approvals:
  timeout: 900  # no answer in 15 minutes is a no

curator:
  enabled: false  # the skill is reviewed code in the factory repo; `hermes profile update` restores it

cron:
  mirror_delivery: true  # a reply to a factory-watch alert reaches Day Desk with the alert as context
