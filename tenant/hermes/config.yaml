# Day Desk's settings (ADR-0013). `hermes profile install` copies this file into the profile, and
# `hermes -p day-desk model` and `hermes -p day-desk gateway setup` then add the model and the
# Telegram settings. Secrets live in the profile's .env, never here.

mcp_servers:
  # Day Desk drives the factory (ADR-0030). factory-mcp listens on loopback only; if you set
  # FACTORY_PORT, set the same port in both entries. factory_tick and factory_intake stay out of
  # both: factory-mcp ticks on its own.
  factory_drive:
    url: "http://127.0.0.1:43125/mcp"
    headers:
      Authorization: "Bearer ${FACTORY_AGENT_TOKEN}"  # factory-mcp lists only the driving tools for it
    trust: full  # no yes per call: factory-mcp's guards bound these tools, and the token names the caller
    # No tools.include here: the token already limits the list to factory_mcp.tools.AGENT_TOOLS, and a
    # hand-merged copy of that list once hid a new driving tool (ADR-0048). `factory update` removes
    # one from a profile installed before that.
  factory:
    url: "http://127.0.0.1:43125/mcp"
    headers:
      Authorization: "Bearer ${FACTORY_MCP_TOKEN}"
    trust: full  # no yes per call either (ADR-0041); the owner's token still names the caller
    tools:
    # Deployment note: a live profile whose include list below predates a reviewed tool is
    # widened to this list by `factory update` (ADR-0071); no other live setting is touched.
      include:  # a repo's setup and gate secrets, and the lessons its workers read, on the owner's token
        - factory_bootstrap_repo
        - factory_add_repo
        - factory_approve_lesson
        - factory_retire_lesson
        - factory_approve_plan_allowance

# Every toolset is on (ADR-0041). terminal, file and code_execution run in the Docker sandbox below;
# browser and computer_use act on the host as the owner.

terminal:
  # A container per session, from tenant/hermes/sandbox. It gets no host directory it can write and
  # one secret: the GitHub token, which the image's gh wrapper hands to gh as GH_TOKEN.
  backend: docker
  docker_image: "day-desk-sandbox:1"
  # From the host, Hermes mounts only the profile's skills and caches, read-only. The container
  # goes with the session.
  container_persistent: false
  cwd: /day-desk  # the image user's home, which it can write; Hermes's tmpfs over /root is root's
  env_passthrough: [DAYDESK_GITHUB_TOKEN]

approvals:
  mode: manual  # what Hermes gates (computer_use actions, a host command it flags) waits for the owner
  timeout: 900  # no answer in 15 minutes is a no

gateway:
  # Day Desk runs its own gateway. On a gateway Hermes treats as multi-profile, the sandbox's
  # DAYDESK_GITHUB_TOKEN is read outside any profile's secret scope and every shell call fails
  # with UnscopedSecretError (ADR-0041).
  standalone: true

curator:
  enabled: false  # the skill is reviewed code in the factory repo; `hermes profile update` restores it

cron:
  mirror_delivery: true  # a reply to a factory-watch alert reaches Day Desk with the alert as context
